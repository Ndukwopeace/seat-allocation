name: CD

# Deploys to Vercel once CI has passed on main — never deploys code that
# hasn't been built/typechecked/linted/tested first. Also runnable by hand.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run doesn't check out the triggering commit by default.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Applies pending migrations to the production database *before* the
      # new code that depends on them goes live. Requires the
      # PRODUCTION_DATABASE_URL secret — see the setup notes below.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL secret is not set — see .github/workflows/cd.yml for setup notes."
            exit 1
          fi
          npx prisma migrate deploy

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

# --- One-time setup -----------------------------------------------------
#
# Repo secrets required (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN            Personal/team token from vercel.com/account/tokens
#   VERCEL_ORG_ID           From `vercel link` in the project locally — see
#                           .vercel/project.json (orgId)
#   VERCEL_PROJECT_ID       Same file, projectId
#   PRODUCTION_DATABASE_URL Connection string for the PRODUCTION Postgres
#                           (e.g. Neon/Supabase/Vercel Postgres) — this is
#                           NOT the same database as local dev.
#
# In the Vercel project itself (Settings -> Environment Variables), set for
# the Production environment:
#   DATABASE_URL      same value as PRODUCTION_DATABASE_URL above
#   SESSION_SECRET     a long random value (e.g. `openssl rand -hex 32`) —
#                      never reuse the local dev value from .env.example
